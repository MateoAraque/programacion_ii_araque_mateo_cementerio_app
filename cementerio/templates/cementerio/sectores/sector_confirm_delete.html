{% extends 'cementerio/base.html' %}
{% block title %}Confirmar eliminación{% endblock %}
{% block content %}
<h1>Confirmar eliminación</h1>
<p>¿Estás seguro de que quieres eliminar: <strong>{{ sector }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sí, eliminar</button>
    <a href="{% url 'sector_detail' sector.pk %}">Cancelar</a>
</form>
{% endblock %}
